<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Private Wedding Website</title>
  <script nonce="{{NONCE}}">
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style nonce="{{NONCE}}">
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--cp-bg);
      color: var(--cp-text);
      font: 16px/1.6 "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    main {
      width: min(100%, 440px);
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      padding: 32px;
    }
    h1 { font-size: 28px; margin: 0 0 12px; line-height: 1.2; }
    p { color: var(--cp-text-muted); }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input, button { width: 100%; padding: 12px; border-radius: 0.625rem; font: inherit; }
    input { background: var(--cp-bg-elevated); color: var(--cp-text); border: 1px solid var(--cp-border-strong); }
    button { margin-top: 16px; border: 0; background: var(--cp-accent); color: var(--cp-accent-fg); cursor: pointer; font-weight: 600; }
    button:hover { background: var(--cp-accent-hover); }
    :focus-visible { outline: 3px solid var(--cp-link); outline-offset: 3px; }
    .error { color: var(--cp-danger); }
    .error:empty { display: none; }
    .note { font-size: 14px; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <h1>You're invited</h1>
    <p>Enter the guest password from your invitation to view our private wedding website.</p>
    <p class="error" role="alert">{{MESSAGE}}</p>
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{NEXT}}">
      <label for="password">Guest password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required autofocus>
      <button type="submit">Enter website</button>
    </form>
    <p class="note">Your sign-in lasts 24 hours. Please keep the password private.</p>
  </main>
</body>
</html>
